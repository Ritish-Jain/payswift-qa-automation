[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    ui: mobile UI tests that need an Appium server and a device/emulator
    api: backend API contract tests
    unit: fast tests for framework utilities (no device, no network)
    smoke: minimal happy-path set for quick feedback
    negative: negative and validation flows
    gesture: tests that rely on swipe/scroll gestures
log_cli = false
log_level = INFO
