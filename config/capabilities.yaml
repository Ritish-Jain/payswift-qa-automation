# Capabilities per platform. Values support ${ENV_VAR} and ${ENV_VAR:-default} expansion,
# so CI can override device names, OS versions and app paths without editing this file.

android:
  platformName: Android
  appium:automationName: UiAutomator2
  appium:deviceName: ${ANDROID_DEVICE_NAME:-emulator-5554}
  appium:platformVersion: ${ANDROID_PLATFORM_VERSION:-14}
  appium:app: ${ANDROID_APP_PATH:-apps/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk}
  appium:appPackage: com.swaglabsmobileapp
  appium:appWaitActivity: com.swaglabsmobileapp.*
  appium:autoGrantPermissions: true
  appium:newCommandTimeout: 120
  appium:noReset: false

ios:
  platformName: iOS
  appium:automationName: XCUITest
  appium:deviceName: ${IOS_DEVICE_NAME:-iPhone 15}
  appium:platformVersion: ${IOS_PLATFORM_VERSION:-17.5}
  appium:app: ${IOS_APP_PATH:-apps/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.app}
  appium:autoAcceptAlerts: true
  appium:newCommandTimeout: 120
  appium:noReset: false
